<title>Catálogo Jota Importados — Gafas 2025</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F0E6D3}
.hdr{background:#5C3D2E;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #C0603A;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:16px}
.logo-icon{background:#C0603A;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.marca{font-family:Georgia,serif;font-size:28px;color:#F5ECD7;letter-spacing:3px;line-height:1;font-weight:700}
.subtag{font-family:Georgia,serif;font-size:11px;color:#C0A882;letter-spacing:6px;margin-top:3px}
.hdr-r{text-align:right}
.hdr-tel{font-size:14px;font-weight:700;color:#F5ECD7;display:flex;align-items:center;gap:7px;justify-content:flex-end}
.wa-icon{width:17px;height:17px;flex-shrink:0}
.hdr-sub{font-size:10px;color:#C0A882;margin-top:4px}
.barra{padding:12px 28px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#FDF6EC;border-bottom:1px solid #E2D0B4;position:sticky;top:89px;z-index:99}
.barra label{font-size:12px;color:#7A5C45;font-weight:600}
.barra select{font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid #C0A882;background:#FDF6EC;color:#3B2A1E;cursor:pointer}
.stats{font-size:12px;color:#7A5C45;display:flex;gap:16px;margin-left:8px}
.stats b{color:#5C3D2E}
.ok{color:#4A7C59}.no{color:#A0392A}
.sec{padding:12px 20px 0}
.sec-hdr{background:#8B5E3C;color:#FDF6EC;padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:1.5px;border-radius:5px 5px 0 0;display:flex;justify-content:space-between;align-items:center}
.sec-hdr span{color:#C0A882;font-size:10px;font-weight:400;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;padding:10px;background:#FDF6EC;border:1px solid #E2D0B4;border-radius:0 0 5px 5px;margin-bottom:14px}
.card{background:#FFFDF8;border:1px solid #E2D0B4;border-radius:9px;overflow:hidden;transition:border-color .2s,transform .15s}
.card:hover{border-color:#C0603A;transform:translateY(-2px)}
.card.agotado{opacity:.55}
.card img{width:100%;height:130px;object-fit:contain;background:#F5ECD7;padding:8px;display:block}
.card-body{padding:8px 9px 10px}
.card-nombre{font-size:11.5px;font-weight:700;color:#3B2A1E;line-height:1.3}
.card-cod{font-size:10px;color:#7A5C45;margin-top:3px;font-family:'Courier New',monospace}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;margin-top:5px}
.badge-ok{background:#E8F0EB;color:#2E5C3A}
.badge-no{background:#F5E8E5;color:#7A2A1E}
.footer{background:#5C3D2E;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;margin-top:6px;border-top:3px solid #C0603A}
.footer-logo{display:flex;align-items:center;gap:14px}
.footer-icon{background:#C0603A;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.footer-marca{font-family:Georgia,serif;font-size:17px;color:#F5ECD7;letter-spacing:2px;font-weight:700}
.footer-sub{font-size:9px;color:#C0A882;letter-spacing:4px;margin-top:2px}
.footer-r{text-align:right;font-size:11px;color:#C0A882;line-height:2}
.footer-r b{color:#F5ECD7}
@media print{.barra{display:none}.hdr{position:static}body{background:#fff}}
</style>
</head>

function imgUrl(id){return`https://lh3.googleusercontent.com/sitesv/${id}=w400`}
const lineas=[...new Set(P.map(p=>p[0]))];

function init(){
  const s=document.getElementById('fLinea');
  lineas.forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=l;s.appendChild(o)});
  render();
}

function render(){
  const fl=document.getElementById('fLinea').value;
  const fs=document.getElementById('fStock').value;
  const f=P.filter(p=>(!fl||p[0]===fl)&&(!fs||(fs==='ok'&&p[3])||(fs==='no'&&!p[3])));
  const t=f.length, e=f.filter(p=>p[3]).length;
  document.getElementById('stats').innerHTML=
    `<span><b>${t}</b> modelos</span><span class="ok"><b>${e}</b> en stock ✅</span><span class="no"><b>${t-e}</b> sin stock ❌</span>`;
  const g={};
  f.forEach(p=>{(g[p[0]]=g[p[0]]||[]).push(p)});
  const cat=document.getElementById('cat');
  cat.innerHTML='';
  Object.entries(g).forEach(([l,items])=>{
    const es=items.filter(i=>i[3]).length;
    const sec=document.createElement('div');
    sec.className='sec';
    sec.innerHTML=`<div class="sec-hdr">${l.toUpperCase()} <span>${es}/${items.length} en stock</span></div>`;
    const grid=document.createElement('div');
    grid.className='grid';
    items.forEach(([,n,c,s,id])=>{
      const card=document.createElement('div');
      card.className='card'+(s?'':' agotado');
      card.innerHTML=`<img src="${imgUrl(id)}" alt="${n}" loading="lazy" onerror="this.style.background='#E8DCC8';this.style.minHeight='130px'">
        <div class="card-body">
          <div class="card-nombre">${n}</div>
          <div class="card-cod">${c}</div>
          <span class="badge ${s?'badge-ok':'badge-no'}">${s?'✅ En stock':'❌ Sin stock'}</span>
        </div>`;
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    cat.appendChild(sec);
  });
}
init();
</script>
